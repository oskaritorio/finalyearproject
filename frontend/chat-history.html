<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MuseChum - Chat History</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .session-card {
            border: 1px solid #F0E6D6;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .session-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .session-date {
            color: #8B7A6B;
            font-size: 14px;
        }
        .crisis-badge {
            background: #E8A598;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
        }
        .session-actions {
            display: flex;
            gap: 12px;
            margin-top: 12px;
        }
        .btn-export {
            background: #9CAF88;
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 30px;
            cursor: pointer;
        }
        .btn-delete {
            background: #E8A598;
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 30px;
            cursor: pointer;
        }
        .btn-delete-all {
            background: #E53E3E;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .export-options {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            align-items: center;
            flex-wrap: wrap;
        }
        .export-options select {
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid #F0E6D6;
            background: white;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: white;
            border-radius: 24px;
            padding: 32px;
            max-width: 400px;
            text-align: center;
        }
        .modal-buttons {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }
        .btn-cancel {
            background: #A0AEC0;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
        }
        .btn-confirm {
            background: #E53E3E;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📓 MuseChum</h1>
            <div class="nav-links">
                <a href="dashboard.html">Dashboard</a>
                <a href="journal.html">Journal</a>
                <a href="chat.html">Chat</a>
                <a href="mood.html">Mood & Wellbeing</a>
                <a href="settings.html">Settings</a>
                <a href="#" onclick="logout()" style="color: #E8A598;">Logout</a>
            </div>
        </div>

        <div class="card">
            <h2>💬 Chat History</h2>
            
            <div class="export-options">
                <select id="exportFormat">
                    <option value="txt">TXT Format</option>
                    <option value="json">JSON Format</option>
                </select>
                <button id="exportAllBtn" class="btn-export">Export All Chats</button>
                <button id="deleteAllBtn" class="btn-delete-all">Delete All Chat History</button>
            </div>
            
            <div id="sessionsList">Loading...</div>
        </div>
    </div>

    <!-- Delete Session Modal -->
    <div id="deleteSessionModal" class="modal">
        <div class="modal-content">
            <h3>Delete Session</h3>
            <p>Are you sure you want to delete this conversation?</p>
            <div class="modal-buttons">
                <button class="btn-cancel" id="cancelSessionDelete">Cancel</button>
                <button class="btn-confirm" id="confirmSessionDelete">Delete</button>
            </div>
        </div>
    </div>

    <!-- Delete All Modal -->
    <div id="deleteAllModal" class="modal">
        <div class="modal-content">
            <h3>Delete All Chat History</h3>
            <p>Are you sure? This will delete ALL your conversations permanently.</p>
            <div class="modal-buttons">
                <button class="btn-cancel" id="cancelAllDelete">Cancel</button>
                <button class="btn-confirm" id="confirmAllDelete">Delete All</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000';
        let currentSessionToDelete = null;
        
        function getAuth() {
            const auth = localStorage.getItem('auth');
            return auth ? { 'Authorization': 'Basic ' + auth } : {};
        }
        
        function logout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }
        
        if (!localStorage.getItem('user')) {
            window.location.href = 'index.html';
        }
        
        async function loadSessions() {
            const container = document.getElementById('sessionsList');
            container.innerHTML = 'Loading...';
            
            try {
                const response = await fetch(`${API_URL}/chat/history`, {
                    headers: getAuth()
                });
                
                if (response.ok) {
                    const data = await response.json();
                    const sessions = data.sessions || [];
                    
                    if (sessions.length === 0) {
                        container.innerHTML = '<div class="empty-state">No chat history yet. Start a conversation!</div>';
                        return;
                    }
                    
                    let html = '';
                    for (let i = 0; i < sessions.length; i++) {
                        const s = sessions[i];
                        const date = new Date(s.started_at).toLocaleString();
                        const msgCount = s.messages ? s.messages.length : 0;
                        const crisisBadge = s.crisis_detected ? '<span class="crisis-badge">⚠️ Crisis Support Given</span>' : '';
                        
                        html += `
                            <div class="session-card" data-session-id="${s.session_id}">
                                <div class="session-header">
                                    <div>
                                        <span class="session-date">${date}</span>
                                        ${crisisBadge}
                                    </div>
                                    <span>${msgCount} messages</span>
                                </div>
                                <div class="session-actions">
                                    <button class="btn-export" onclick="exportSession('${s.session_id}')">Export</button>
                                    <button class="btn-delete" onclick="showDeleteModal('${s.session_id}')">Delete</button>
                                </div>
                            </div>
                        `;
                    }
                    container.innerHTML = html;
                } else if (response.status === 401) {
                    window.location.href = 'index.html';
                } else {
                    container.innerHTML = '<div class="empty-state">Failed to load chat history</div>';
                }
            } catch (error) {
                container.innerHTML = '<div class="empty-state">Cannot connect to server</div>';
            }
        }
        
        window.showDeleteModal = function(sessionId) {
            currentSessionToDelete = sessionId;
            document.getElementById('deleteSessionModal').classList.add('active');
        };
        
        window.exportSession = async function(sessionId) {
            const format = document.getElementById('exportFormat').value;
            
            try {
                const response = await fetch(`${API_URL}/chat/export/${sessionId}`, {
                    headers: getAuth()
                });
                
                if (response.ok) {
                    const data = await response.json();
                    downloadFile(data, format, `session-${sessionId}`);
                } else {
                    alert('Failed to export session');
                }
            } catch (error) {
                alert('Cannot connect to server');
            }
        };
        
        async function exportAll() {
            const format = document.getElementById('exportFormat').value;
            
            try {
                const response = await fetch(`${API_URL}/chat/export/all`, {
                    headers: getAuth()
                });
                
                if (response.ok) {
                    const data = await response.json();
                    downloadFile(data, format, 'all-chats');
                } else {
                    alert('Failed to export chats');
                }
            } catch (error) {
                alert('Cannot connect to server');
            }
        }
        
        function downloadFile(data, format, filename) {
            let content, extension, mimeType;
            
            if (format === 'json') {
                content = JSON.stringify(data, null, 2);
                extension = 'json';
                mimeType = 'application/json';
            } else {
                let text = `MuseChum Chat Export\n`;
                text += `Generated: ${new Date().toLocaleString()}\n`;
                text += `${'='.repeat(50)}\n\n`;
                
                if (data.sessions) {
                    for (const session of data.sessions) {
                        text += `Session: ${new Date(session.started_at).toLocaleString()}\n`;
                        text += `${'-'.repeat(30)}\n`;
                        for (const msg of session.messages) {
                            text += `[${new Date(msg.timestamp).toLocaleTimeString()}] ${msg.sender.toUpperCase()}: ${msg.content}\n`;
                        }
                        text += `\n${'='.repeat(50)}\n\n`;
                    }
                }
                
                content = text;
                extension = 'txt';
                mimeType = 'text/plain';
            }
            
            const blob = new Blob([content], { type: mimeType });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `musechum-${filename}.${extension}`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
        
        async function deleteSession() {
            if (!currentSessionToDelete) return;
            
            try {
                const response = await fetch(`${API_URL}/chat/session/${currentSessionToDelete}`, {
                    method: 'DELETE',
                    headers: getAuth()
                });
                
                if (response.ok) {
                    document.getElementById('deleteSessionModal').classList.remove('active');
                    loadSessions();
                } else {
                    alert('Failed to delete session');
                }
            } catch (error) {
                alert('Cannot connect to server');
            }
            currentSessionToDelete = null;
        }
        
        async function deleteAllSessions() {
            try {
                const response = await fetch(`${API_URL}/chat/all`, {
                    method: 'DELETE',
                    headers: getAuth()
                });
                
                if (response.ok) {
                    document.getElementById('deleteAllModal').classList.remove('active');
                    loadSessions();
                } else {
                    alert('Failed to delete all chats');
                }
            } catch (error) {
                alert('Cannot connect to server');
            }
        }
        
        document.getElementById('exportAllBtn').addEventListener('click', exportAll);
        document.getElementById('deleteAllBtn').addEventListener('click', () => {
            document.getElementById('deleteAllModal').classList.add('active');
        });
        document.getElementById('cancelSessionDelete').addEventListener('click', () => {
            document.getElementById('deleteSessionModal').classList.remove('active');
            currentSessionToDelete = null;
        });
        document.getElementById('confirmSessionDelete').addEventListener('click', deleteSession);
        document.getElementById('cancelAllDelete').addEventListener('click', () => {
            document.getElementById('deleteAllModal').classList.remove('active');
        });
        document.getElementById('confirmAllDelete').addEventListener('click', deleteAllSessions);
        
        loadSessions();
    </script>
</body>
</html>
