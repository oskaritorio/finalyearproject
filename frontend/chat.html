<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MuseChum - Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Only chat-specific styles */
        .chat-container {
            background: var(--card-warm);
            border-radius: 32px;
            padding: 24px;
            height: 550px;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-soft);
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 20px;
            padding: 10px;
        }
        .message {
            margin: 16px 0;
            display: flex;
            animation: fadeInUp 0.3s ease;
        }
        .message.user {
            justify-content: flex-end;
        }
        .message.user .message-content {
            background: linear-gradient(135deg, var(--accent-sage) 0%, #8BAF78 100%);
            color: white;
            padding: 12px 20px;
            border-radius: 28px;
            border-bottom-right-radius: 8px;
            max-width: 75%;
        }
        .message.bot .message-content {
            background: var(--accent-honey);
            color: var(--text-soft);
            padding: 12px 20px;
            border-radius: 28px;
            border-bottom-left-radius: 8px;
            max-width: 75%;
        }
        .input-area {
            display: flex;
            gap: 12px;
        }
        .input-area input {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid #F0E6D6;
            border-radius: 60px;
            font-family: inherit;
            transition: all 0.3s ease;
        }
        .input-area input:focus {
            outline: none;
            border-color: var(--accent-sage);
            box-shadow: 0 0 0 4px rgba(156, 175, 136, 0.1);
        }
        .crisis-alert {
            background: linear-gradient(135deg, #FDE2E2 0%, #FCE8E8 100%);
            border: 2px solid var(--accent-terracotta);
            border-radius: 24px;
            padding: 16px;
            margin-top: 16px;
            color: #C2786B;
            font-size: 13px;
            text-align: center;
            animation: pulse 2s infinite;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📓 MuseChum</h1>
            <div class="nav-links">
                <a href="dashboard.html">Dashboard</a>
                <a href="journal.html">Journal</a>
                <a href="chat.html" style="font-weight: bold; color: #4A90D9;">Chat</a>
                <a href="mood.html">Mood</a>
                <a href="#" onclick="logout()" style="color: #e53e3e;">Logout</a>
            </div>
        </div>

        <div class="chat-container">
            <div class="warning-banner">
                🤖 Supportive conversation • Not a crisis service
            </div>
            <div class="chat-messages" id="chatMessages">
                <div class="message bot">
                    <div class="message-content">Hello! I'm here to listen. How are you feeling today?</div>
                </div>
            </div>
            <div class="input-area">
                <input type="text" id="messageInput" placeholder="Type your message...">
                <button id="sendBtn">Send</button>
            </div>
            <div id="crisisAlert" class="crisis-alert hidden">
                🆘 If you're in crisis, please reach out:<br>
                📞 Samaritans: 116 123 (free, 24/7)<br>
                📞 NHS 111: 111<br>
                📞 SHOUT: Text 85258
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000';
        
        function getAuth() {
            const auth = localStorage.getItem('auth');
            return auth ? { 'Authorization': `Basic ${auth}` } : {};
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function addMessage(text, sender) {
            const container = document.getElementById('chatMessages');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            msgDiv.innerHTML = `<div class="message-content">${escapeHtml(text)}</div>`;
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }
        
        function showCrisisAlert() {
            document.getElementById('crisisAlert').classList.remove('hidden');
        }
        
        function hideCrisisAlert() {
            document.getElementById('crisisAlert').classList.add('hidden');
        }
        
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            addMessage(message, 'user');
            input.value = '';
            
            try {
                const response = await fetch(`${API_URL}/chat/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        ...getAuth()
                    },
                    body: JSON.stringify({ message: message })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    addMessage(data.reply, 'bot');
                    
                    // Check for crisis detection
                    if (data.category === 'CRISIS' || data.crisis_help) {
                        showCrisisAlert();
                    } else {
                        hideCrisisAlert();
                    }
                } else if (response.status === 401) {
                    addMessage('Session expired. Please login again.', 'bot');
                    setTimeout(() => { window.location.href = 'index.html'; }, 2000);
                } else {
                    addMessage('Sorry, I had trouble responding. Please try again.', 'bot');
                }
            } catch (error) {
                console.error('Chat error:', error);
                addMessage('Cannot connect to server. Is the backend running?', 'bot');
            }
        }
        
        function logout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }
        
        // Check login
        if (!localStorage.getItem('user')) {
            window.location.href = 'index.html';
        }
        
        // Setup event listeners
        document.getElementById('sendBtn').addEventListener('click', sendMessage);
        document.getElementById('messageInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
