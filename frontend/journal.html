<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MuseChum - Journal</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Only journal-specific styles that aren't in style.css */
        .entry {
            border-bottom: 1px solid #F0E6D6;
            padding: 20px;
            margin-bottom: 12px;
            transition: all 0.3s ease;
            border-radius: 20px;
        }
        .entry:hover {
            background: rgba(156, 175, 136, 0.05);
            transform: translateX(4px);
        }
        .entry-mood {
            font-size: 28px;
        }
        .entry-date {
            color: var(--text-light);
            font-size: 12px;
        }
        .delete-btn {
            color: var(--accent-terracotta);
            cursor: pointer;
            font-size: 12px;
            margin-left: 12px;
            transition: all 0.2s ease;
        }
        .delete-btn:hover {
            color: #C2786B;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📓 MuseChum</h1>
            <div class="nav-links">
                <a href="dashboard.html">Dashboard</a>
                <a href="journal.html" style="font-weight: bold; color: #4A90D9;">Journal</a>
                <a href="chat.html">Chat</a>
                <a href="mood.html">Mood</a>
                <a href="#" onclick="logout()" style="color: #e53e3e;">Logout</a>
            </div>
        </div>

        <div class="card">
            <h3>📝 Write New Entry</h3>
            <div class="mood-selector" id="moodSelector">
                <span class="mood-option" data-mood="1">😢</span>
                <span class="mood-option" data-mood="2">😐</span>
                <span class="mood-option" data-mood="3">🙂</span>
                <span class="mood-option" data-mood="4">😊</span>
                <span class="mood-option" data-mood="5">🤗</span>
            </div>
            <textarea id="content" rows="4" placeholder="What's on your mind?..."></textarea>
            <button onclick="saveEntry()">Save Entry</button>
        </div>

        <div class="card">
            <h3>📖 Previous Entries</h3>
            <div id="entriesList">Loading...</div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000';
        let selectedMood = 3;
        
        function getAuth() {
            const auth = localStorage.getItem('auth');
            return auth ? { 'Authorization': `Basic ${auth}` } : {};
        }
        
        // Setup mood selector
        document.querySelectorAll('.mood-option').forEach(emoji => {
            emoji.addEventListener('click', function() {
                document.querySelectorAll('.mood-option').forEach(e => e.classList.remove('selected'));
                this.classList.add('selected');
                selectedMood = parseInt(this.getAttribute('data-mood'));
            });
        });
        
        // Set default selected mood
        document.querySelector('.mood-option[data-mood="3"]').classList.add('selected');
        
        function showToast(message, isError = false) {
            const toast = document.createElement('div');
            toast.className = `toast ${isError ? 'error' : ''}`;
            toast.textContent = message;
            document.body.appendChild(toast);
    
            setTimeout(() => {
                toast.remove();
            }, 2000);
        }

        async function saveEntry() {
            const content = document.getElementById('content').value;
            if (!content.trim()) {
                showToast('Please write something first', true);
                return;
            }
    
            const saveData = {
                content: content,
                mood: selectedMood
            };
    
            try {
                const response = await fetch(`${API_URL}/journal/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        ...getAuth()
                    },
                    body: JSON.stringify(saveData)
                });
        
                if (response.ok) {
                    showToast('✅ Entry saved!');
                    document.getElementById('content').value = '';
                    loadEntries();
                 } else {
                    showToast('❌ Failed to save entry', true);
                        }
            } catch (error) {
                showToast('❌ Cannot connect to server', true);
            }
        }
        
        async function loadEntries() {
            const container = document.getElementById('entriesList');
            container.innerHTML = 'Loading...';
            
            try {
                const response = await fetch(`${API_URL}/journal/`, {
                    headers: getAuth()
                });
                
                if (response.ok) {
                    const data = await response.json();
                    const entries = data.entries || [];
                    
                    if (entries.length === 0) {
                        container.innerHTML = 'No entries yet. Write your first one above!';
                        return;
                    }
                    
                    container.innerHTML = entries.map(entry => `
                        <div class="entry">
                            <span class="entry-mood">${getMoodEmoji(entry.mood_score)}</span>
                            <span class="entry-date">${new Date(entry.created_at).toLocaleDateString()}</span>
                            <span class="delete-btn" onclick="deleteEntry('${entry.id}')">Delete</span>
                            <p>${escapeHtml((entry.content || entry.encrypted_content || '').substring(0, 200))}</p>
                        </div>
                    `).join('');
                } else if (response.status === 401) {
                    window.location.href = 'index.html';
                } else {
                    container.innerHTML = 'Failed to load entries';
                }
            } catch (error) {
                console.error('Error:', error);
                container.innerHTML = 'Cannot connect to server';
            }
        }
        
        async function deleteEntry(id) {
            if (!confirm('Delete this entry?')) return;
            
            const response = await fetch(`${API_URL}/journal/${id}`, {
                method: 'DELETE',
                headers: getAuth()
            });
            
            if (response.ok) {
                loadEntries();
            } else {
                alert('Failed to delete');
            }
        }
        
        function getMoodEmoji(score) {
            const emojis = {1: '😢', 2: '😐', 3: '🙂', 4: '😊', 5: '🤗'};
            return emojis[score] || '🙂';
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function logout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }
        
        if (!localStorage.getItem('user')) {
            window.location.href = 'index.html';
        }
        
        loadEntries();
    </script>
</body>
</html>
