<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MuseChum - Wellbeing Assessment</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .question-card {
            background: var(--card-warm);
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-soft);
        }
        .question-text {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 20px;
            color: var(--text-soft);
            line-height: 1.4;
        }
        .scale {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin: 16px 0;
        }
        .scale-option {
            flex: 1;
            text-align: center;
            padding: 12px 8px;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #F0E6D6;
            color: var(--text-soft);
            font-weight: 500;
        }
        .scale-option:hover {
            background: var(--accent-honey);
            transform: scale(1.02);
        }
        .scale-option.selected {
            background: var(--accent-sage);
            color: white;
            transform: scale(1.02);
            box-shadow: 0 2px 8px rgba(156, 175, 136, 0.3);
        }
        .scale-labels {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 12px;
            color: var(--text-light);
        }
        .scale-label-left {
            text-align: left;
        }
        .scale-label-right {
            text-align: right;
        }
        .submit-btn {
            margin-top: 24px;
            width: 100%;
        }
        .section-title {
            margin-bottom: 20px;
            color: var(--accent-sage);
        }
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--accent-sage);
            text-decoration: none;
            font-weight: 500;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-light);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📓 MuseChum</h1>
            <div class="nav-links">
                <a href="dashboard.html">Dashboard</a>
                <a href="journal.html">Journal</a>
                <a href="chat.html">Chat</a>
                <a href="mood.html">Mood & Wellbeing</a>
                <a href="settings.html">Settings</a>
                <a href="#" onclick="logout()" style="color: #E8A598;">Logout</a>
            </div>
        </div>

        <a href="mood.html" class="back-link">← Back to Mood & Wellbeing</a>

        <div id="questionsContainer">
            <div class="loading">Loading questions...</div>
        </div>

        <div id="submitSection" style="display: none; margin-top: 20px;">
            <button id="submitBtn" class="submit-btn">Submit Assessment</button>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/wellbeing.js"></script>
</body>
</html>
