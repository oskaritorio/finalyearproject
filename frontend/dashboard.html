<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MuseChum - Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 24px;
            padding: 32px;
        }
        h1 {
            color: #4A90D9;
            margin-bottom: 20px;
        }
        .welcome {
            background: #e8f0fe;
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 20px;
        }
        .logout-btn {
            color: #e53e3e;
            cursor: pointer;
            float: right;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📓 MuseChum <span class="logout-btn" onclick="logout()">Logout</span></h1>
        
        <div class="welcome">
            <h2>Welcome back, <span id="username"></span>!</h2>
            <p>✅ You are successfully logged in!</p>
        </div>
        
        <p style="text-align: center; color: #718096;">
            Next: We'll add Journal, Chat, and Mood features here
        </p>
    </div>

    <script>
        // Check if logged in
        const user = localStorage.getItem('user');
        if (!user) {
            window.location.href = 'index.html';
        }
        
        // Display username
        const userData = JSON.parse(user);
        document.getElementById('username').textContent = userData.username;
        
        function logout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
