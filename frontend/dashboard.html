<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MuseChum - Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .welcome-card {
            background: white;
            border-radius: 20px;
            padding: 32px;
            text-align: center;
            margin-bottom: 24px;
        }
        
        .quick-links {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
        }
        
        .quick-link-card {
            background: white;
            padding: 24px;
            text-align: center;
            border-radius: 20px;
            text-decoration: none;
            color: #2d3748;
            transition: transform 0.2s;
        }
        
        .quick-link-card:hover {
            transform: translateY(-5px);
        }
        
        .quick-link-card .icon {
            font-size: 48px;
            display: block;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📓 MuseChum</h1>
            <div class="nav-links">
                <a href="dashboard.html" class="active">Dashboard</a>
                <a href="journal.html">Journal</a>
                <a href="chat.html">Chat</a>
                <a href="mood.html">Mood</a>
                <a href="#" class="logout-link" onclick="logout()">Logout</a>
            </div>
        </div>
        
        <div class="welcome-card">
            <h2>Welcome back, <span id="username"></span>! 👋</h2>
            <p>Your private space for wellbeing</p>
        </div>
        
        <div class="quick-links">
            <a href="journal.html" class="quick-link-card">
                <span class="icon">📝</span>
                <h3>Journal</h3>
                <p>Write your thoughts</p>
            </a>
            <a href="chat.html" class="quick-link-card">
                <span class="icon">💬</span>
                <h3>Chat</h3>
                <p>Talk to AI companion</p>
            </a>
            <a href="mood.html" class="quick-link-card">
                <span class="icon">😊</span>
                <h3>Mood</h3>
                <p>Track your feelings</p>
            </a>
        </div>
    </div>
    
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        if (!isLoggedIn()) window.location.href = 'index.html';
        
        const user = getCurrentUser();
        if (user) document.getElementById('username').textContent = user.username;
    </script>
</body>
</html>
