<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MuseChum - Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Only dashboard-specific styles */
        .welcome-card {
            background: linear-gradient(135deg, #FDF8F0 0%, #FFF5E8 100%);
            border-radius: 32px;
            padding: 32px;
            text-align: center;
            margin-bottom: 24px;
            animation: fadeInUp 0.5s ease;
        }
        .quick-links {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 20px;
        }
        .quick-link-card {
            background: var(--card-warm);
            padding: 28px 20px;
            text-align: center;
            border-radius: 32px;
            text-decoration: none;
            color: var(--text-soft);
            transition: all 0.3s cubic-bezier(0.34, 1.2, 0.64, 1);
            box-shadow: var(--shadow-soft);
            border: 1px solid rgba(156, 175, 136, 0.1);
        }
        .quick-link-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-hover);
        }
        .quick-link-card .icon {
            font-size: 48px;
            display: block;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📓 MuseChum</h1>
            <div class="nav-links">
                <a href="dashboard.html" class="active">Dashboard</a>
                <a href="journal.html">Journal</a>
                <a href="chat.html">Chat</a>
                <a href="mood.html">Mood</a>
                <a href="#" class="logout-link" onclick="logout()">Logout</a>
            </div>
        </div>
        <div class="welcome-card floating">
            <h2>Welcome back, <span id="username"></span>! 🌸</h2>
            <p>Your safe space for reflection and growth</p>
        </div>
        
        <div class="quick-links">
            <a href="journal.html" class="quick-link-card">
                <span class="icon">📝</span>
                <h3>Journal</h3>
                <p>Write your thoughts</p>
            </a>
            <a href="chat.html" class="quick-link-card">
                <span class="icon">💬</span>
                <h3>Chat</h3>
                <p>Talk to AI companion</p>
            </a>
            <a href="mood.html" class="quick-link-card">
                <span class="icon">😊</span>
                <h3>Mood</h3>
                <p>Track your feelings</p>
            </a>
        </div>
    </div>
    
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        if (!isLoggedIn()) window.location.href = 'index.html';
        
        const user = getCurrentUser();
        if (user) document.getElementById('username').textContent = user.username;
    </script>
</body>
</html>
